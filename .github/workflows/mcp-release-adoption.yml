name: MCP Release Adoption Notes

on:
  release:
    types: [published]
  # release.yml creates releases with GITHUB_TOKEN, and events caused by that
  # token start no workflows, so `release: published` never fires for them.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag (for example v2.0.0). Leave empty to update latest release."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: mcp-release-notes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enrich-release-notes:
    name: Add MCP install snippets to release notes
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    steps:
      - name: Append MCP install section
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- arbor-mcp-install-snippets -->';
            const snippet = `${marker}
            ## 🤖 Arbor MCP Quick Install

            Use Arbor as a local MCP server in your AI client:

            ### Claude Code (project-scoped)
            \`\`\`bash
            claude mcp add --transport stdio --scope project arbor -- arbor bridge
            claude mcp list
            \`\`\`

            In Claude Code, run:
            \`\`\`text
            /mcp
            \`\`\`

            ### Cursor MCP config (\`.cursor/mcp.json\`)
            \`\`\`json
            {
              "mcpServers": {
                "arbor": {
                  "command": "arbor",
                  "args": ["bridge"]
                }
              }
            }
            \`\`\`

            ### VS Code MCP config (\`.vscode/mcp.json\`)
            \`\`\`json
            {
              "servers": {
                "arbor": {
                  "type": "stdio",
                  "command": "arbor",
                  "args": ["bridge"]
                }
              },
              "inputs": []
            }
            \`\`\`

            ### MCP Directories
            - Glama: https://glama.ai/mcp/servers/@Anandb71/arbor
            - Skills Playground: https://skillsplayground.com/mcps/nandb71-arbor/
            `;

            async function resolveRelease() {
              if (context.eventName === 'release' && context.payload.release) {
                return context.payload.release;
              }

              // core.getInput reads the action's own inputs, not the
              // workflow_dispatch form, so it always came back empty here.
              const tag = (
                context.eventName === 'workflow_run'
                  ? context.payload.workflow_run.head_branch
                  : context.payload.inputs?.tag || ''
              ).trim();
              if (tag) {
                const byTag = await github.rest.repos.getReleaseByTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag,
                });
                return byTag.data;
              }

              // The latest published release. listReleases also returns
              // drafts, and its first entry was a v0.1.1 draft from January.
              const latest = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              return latest.data;
            }

            const release = await resolveRelease();
            if (!release) return;

            const body = (release.body || '').trim();
            if (body.includes(marker)) {
              core.notice(`Release ${release.tag_name} already contains MCP install snippets. Skipping.`);
              return;
            }

            const updatedBody = [body, snippet].filter(Boolean).join('\n\n').trim();

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              body: updatedBody,
            });

            core.notice(`Updated release notes for ${release.tag_name} with MCP install snippets.`);
