name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional explicit release tag (e.g. v2.0.0)."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Resolve tag and version
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          VERSION="${TAG#v}"

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "Invalid semver tag/version resolved: TAG=$TAG VERSION=$VERSION"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  verify-version-sync:
    name: Verify version sync across manifests
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate all release-facing versions match tag
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='${{ needs.prepare.outputs.version }}'

          python3 - <<'PY'
          import json
          import pathlib
          import tomllib
          import sys

          expected = "${{ needs.prepare.outputs.version }}"
          root = pathlib.Path('.')

          mismatches = []

          cargo = tomllib.loads((root / 'Cargo.toml').read_text(encoding='utf-8'))
          workspace_version = cargo.get('workspace', {}).get('package', {}).get('version')
          if workspace_version != expected:
              mismatches.append(("Cargo.toml [workspace.package].version", workspace_version, expected))

          npm_wrapper = json.loads((root / 'packaging' / 'npm' / 'package.json').read_text(encoding='utf-8')).get('version')
          if npm_wrapper != expected:
              mismatches.append(("packaging/npm/package.json version", npm_wrapper, expected))

          vscode_ext = json.loads((root / 'extensions' / 'arbor-vscode' / 'package.json').read_text(encoding='utf-8')).get('version')
          if vscode_ext != expected:
              mismatches.append(("extensions/arbor-vscode/package.json version", vscode_ext, expected))

          agent_card = json.loads((root / 'agent-card.json').read_text(encoding='utf-8')).get('version')
          if agent_card != expected:
              mismatches.append(("agent-card.json version", agent_card, expected))

          # The Homebrew formula and Scoop manifest are not checked here: their
          # version and checksums describe published assets, so the
          # update-checksums job writes them after the build. Bumping them by
          # hand before the tag advertised the new version with the previous
          # release's checksums until that job's pull request merged.

          if mismatches:
              print("::error::Version sync check failed.")
              for path, actual, exp in mismatches:
                  print(f"::error::{path}: found '{actual}', expected '{exp}'")
              sys.exit(1)

          print(f"All manifest versions match release tag: {expected}")
          PY

  qa-gate:
    name: QA gate (fmt/clippy/test)
    needs: [prepare, verify-version-sync]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Skip on tag releases — main-branch Rust CI already validated this commit.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies
        run: bash scripts/ci/install-linux-deps.sh pkg-config libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgtk-3-dev libfontconfig1-dev libasound2-dev libdbus-1-dev libssl-dev cmake build-essential

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

  build:
    name: Build (${{ matrix.target }})
    needs: [prepare, verify-version-sync]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: arbor-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: arbor-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: arbor-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: arbor-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: arbor-windows-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: bash scripts/ci/install-linux-deps.sh pkg-config libssl-dev build-essential cmake

      - name: Install Linux aarch64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: bash scripts/ci/install-linux-deps.sh gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Configure aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p arbor-graph-cli

      - name: Package artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/arbor" "dist/arbor"
          chmod +x dist/arbor
          tar -C dist -czf "${{ matrix.artifact }}.tar.gz" arbor

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/arbor.exe" "dist/arbor.exe"
          Compress-Archive -Path "dist/arbor.exe" -DestinationPath "${{ matrix.artifact }}.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
          if-no-files-found: error

  publish-crates:
    name: Publish crates to crates.io
    needs: [prepare, build]
    runs-on: ubuntu-latest
    # A crates.io failure shows as a failed job with an error annotation, but
    # it must not fail the run: GHCR, npm and the VS Code extension publish
    # only after a successful Release run, so v3.0.0's expired token cost
    # every one of those channels.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: bash scripts/ci/install-linux-deps.sh pkg-config libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgtk-3-dev libfontconfig1-dev libasound2-dev libdbus-1-dev libssl-dev cmake build-essential

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN not set; skipping crates.io publish."
            exit 0
          fi

          crates=(
            arbor-core
            arbor-graph
            arbor-watcher
            arbor-server
            arbor-mcp
            arbor-graph-cli
            arbor-gui
          )

          # Only "this version is already on crates.io" is safe to skip, so a
          # re-run after a partial publish can finish the rest. Anything else,
          # such as an expired token's 403, used to be printed as a warning and
          # dropped, which left crates.io several releases behind unnoticed.
          failed=()
          for crate in "${crates[@]}"; do
            echo "Publishing ${crate}..."
            if output=$(cargo publish -p "${crate}" --allow-dirty 2>&1); then
              echo "Published ${crate}"
            elif grep -Eqi 'already (exists|uploaded)' <<< "$output"; then
              echo "${crate} ${{ needs.prepare.outputs.version }} is already on crates.io; skipping."
            else
              echo "$output"
              echo "::error title=crates.io publish failed::${crate}: $(grep -m1 -i 'error' <<< "$output" || echo 'see log')"
              failed+=("${crate}")
            fi
            sleep 20
          done

          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::Not published to crates.io: ${failed[*]}. A 403 means CARGO_REGISTRY_TOKEN expired or lacks publish scope; rotate it, then re-run this job."
            exit 1
          fi

  release:
    name: Create GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Gather release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          TAG='${{ needs.prepare.outputs.tag }}'
          VERSION='${{ needs.prepare.outputs.version }}'

          cat > release-notes.md <<EOF
          ## Arbor ${TAG}

          ### Installation

          \`\`\`bash
          # macOS / Linux (prebuilt binary)
          curl -fsSL https://raw.githubusercontent.com/Anandb71/arbor/main/scripts/install.sh | bash -s -- --version ${TAG}

          # Windows (PowerShell)
          iwr https://raw.githubusercontent.com/Anandb71/arbor/main/scripts/install.ps1 -OutFile install.ps1; .\install.ps1 -Version ${TAG}

          # Cargo (builds from this tag)
          cargo install --git https://github.com/Anandb71/arbor --tag ${TAG} arbor-graph-cli

          # npm
          npx @anandb71/arbor-cli@${VERSION}

          # Docker
          docker pull ghcr.io/anandb71/arbor:${TAG}
          \`\`\`

          ### Assets

          | Platform | Architecture | File |
          |----------|-------------|------|
          | Linux | x86_64 | \`arbor-linux-x86_64.tar.gz\` |
          | Linux | aarch64 | \`arbor-linux-aarch64.tar.gz\` |
          | macOS | x86_64 | \`arbor-macos-x86_64.tar.gz\` |
          | macOS | Apple Silicon | \`arbor-macos-aarch64.tar.gz\` |
          | Windows | x86_64 | \`arbor-windows-x86_64.zip\` |
          EOF

      - name: Create/Update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          body_path: release-notes.md
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          append_body: true
          overwrite_files: true
          make_latest: true

  update-checksums:
    name: Update Homebrew & Scoop checksums
    needs: [prepare, release]
    runs-on: ubuntu-latest
    # Same reasoning as publish-crates: a failure here is reported, but the
    # release itself is out, and the downstream channels must still publish.
    continue-on-error: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Update package manager manifests
        shell: bash
        run: |
          set -euo pipefail

          VERSION='${{ needs.prepare.outputs.version }}'

          MAC_X64_SHA=$(sha256sum artifacts/arbor-macos-x86_64/arbor-macos-x86_64.tar.gz | cut -d' ' -f1)
          MAC_ARM_SHA=$(sha256sum artifacts/arbor-macos-aarch64/arbor-macos-aarch64.tar.gz | cut -d' ' -f1)
          LINUX_X64_SHA=$(sha256sum artifacts/arbor-linux-x86_64/arbor-linux-x86_64.tar.gz | cut -d' ' -f1)
          LINUX_ARM_SHA=$(sha256sum artifacts/arbor-linux-aarch64/arbor-linux-aarch64.tar.gz | cut -d' ' -f1)
          WIN_X64_SHA=$(sha256sum artifacts/arbor-windows-x86_64/arbor-windows-x86_64.zip | cut -d' ' -f1)

          FILE="packaging/homebrew/arbor.rb"
          SCOOP="packaging/scoop/arbor.json"

          sed -i "s|version \".*\"|version \"${VERSION}\"|" "$FILE"
          sed -i "s|REPLACE_WITH_MACOS_AARCH64_SHA256|${MAC_ARM_SHA}|g" "$FILE"
          sed -i "s|REPLACE_WITH_MACOS_X86_64_SHA256|${MAC_X64_SHA}|g" "$FILE"
          sed -i "s|REPLACE_WITH_LINUX_AARCH64_SHA256|${LINUX_ARM_SHA}|g" "$FILE"
          sed -i "s|REPLACE_WITH_LINUX_X86_64_SHA256|${LINUX_X64_SHA}|g" "$FILE"
          sed -i "/arbor-macos-aarch64.tar.gz/!b;n;s|sha256 \".*\"|sha256 \"${MAC_ARM_SHA}\"|" "$FILE"
          sed -i "/arbor-macos-x86_64.tar.gz/!b;n;s|sha256 \".*\"|sha256 \"${MAC_X64_SHA}\"|" "$FILE"
          sed -i "/arbor-linux-aarch64.tar.gz/!b;n;s|sha256 \".*\"|sha256 \"${LINUX_ARM_SHA}\"|" "$FILE"
          sed -i "/arbor-linux-x86_64.tar.gz/!b;n;s|sha256 \".*\"|sha256 \"${LINUX_X64_SHA}\"|" "$FILE"

          sed -i "s|\"version\": \".*\"|\"version\": \"${VERSION}\"|" "$SCOOP"
          # The Scoop download URL carries the version literally and was never
          # rewritten, so the manifest advertised the new version while still
          # pointing at the previous release's zip.
          sed -i -E "s|(releases/download/)v[0-9]+[.][0-9]+[.][0-9]+(/arbor-windows-x86_64[.]zip)|\1v${VERSION}\2|" "$SCOOP"
          sed -i "s|REPLACE_WITH_WINDOWS_X86_64_SHA256|${WIN_X64_SHA}|g" "$SCOOP"
          sed -i "s|\"hash\": \".*\"|\"hash\": \"${WIN_X64_SHA}\"|" "$SCOOP"

      - name: Commit and push manifest updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add packaging/homebrew/arbor.rb packaging/scoop/arbor.json
          if git diff --cached --quiet; then
            echo "No manifest updates required."
            exit 0
          fi

          VERSION='${{ needs.prepare.outputs.version }}'
          git commit -m "chore: update manifests for v${VERSION} [skip ci]"
          git pull --rebase origin main

          # `main` requires a pull request, so a direct push always fails here.
          # This step used to end in `|| echo "::warning::"`, which swallowed
          # that failure: the job reported success while the Homebrew formula
          # and Scoop manifest kept the *previous* release's checksums, so
          # `brew install` broke for everyone on the new version and nothing in
          # CI said so.
          #
          # Try the direct push in case protection is ever relaxed, otherwise
          # open a PR. If neither works, fail — silently shipping stale
          # checksums is the outcome this must never repeat.
          if git push origin main 2>/dev/null; then
            echo "Pushed manifest updates directly to main."
            exit 0
          fi

          echo "Direct push rejected (branch protection); opening a pull request."
          BRANCH="chore/manifest-checksums-v${VERSION}"
          git push --force origin "HEAD:${BRANCH}"

          # Opening the PR needs "Allow GitHub Actions to create and approve
          # pull requests" (Settings > Actions > General). Without it the
          # branch is still pushed, so point at it and fail visibly.
          if ! gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "chore: update package manifests for v${VERSION}" \
            --body "Homebrew and Scoop checksums for the v${VERSION} release assets, generated by the release workflow. Merge to keep \`scoop install\` and the Homebrew formula working on the new version."; then
            echo "::error title=Manifest PR not opened::Branch ${BRANCH} holds the v${VERSION} checksums. Open it: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BRANCH}"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
