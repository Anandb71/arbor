name: Arbor Impact Analysis
description: Run Arbor graph-native code impact analysis in GitHub Actions.
branding:
  icon: git-branch
  color: blue

inputs:
  command:
    description: Arbor command to run (without leading 'arbor'). For example 'diff .' or 'status .'.
    required: false
    default: status .
  arbor-version:
    description: Arbor CLI version to install (e.g. 1.6.2). Use 'latest' for newest.
    required: false
    default: latest
  install-from-source:
    description: Install from this repository source using Cargo instead of crates.io.
    required: false
    default: "false"
  working-directory:
    description: Directory where the Arbor command should run.
    required: false
    default: .
  comment-on-pr:
    description: "Post the impact report as a comment on the Pull Request when running in a PR workflow."
    required: false
    default: "true"
  github-token:
    description: "The GITHUB_TOKEN secret, needed to post PR comments."
    required: false
    default: "${{ github.token }}"
  mode:
    description: "'command' (default) runs the command input. Any other value fails the step before anything is installed. 'retirements' finds direct SDK calls to AI models their provider has retired or is retiring, writes a job summary and annotates the affected lines (up to GitHub's 10 warnings per step; the summary lists every call). It runs on the runner; no code is sent anywhere."
    required: false
    default: command
  retirements-path:
    description: "Retirements mode: the directory or file to check, relative to working-directory."
    required: false
    default: .
  retirements-fail-on:
    description: "Retirements mode: 'never' (default; warnings only), 'retired' (fail when a confirmed call uses a model that is already retired), or a number of days (also fail when a model retires within that many days). A check that cannot run (exit 2) fails the step whatever this says."
    required: false
    default: never
  retirements-include-routed:
    description: "Retirements mode: also list calls through Azure, another host in base_url or another cloud, where the provider's dates may not apply, and let them fail the check."
    required: false
    default: "false"
  retirements-count-unconfirmed:
    description: "Retirements mode: also let unconfirmed calls fail the check (environment or config fallbacks, parameter defaults, possible values, unresolved clients, unknown routing). They are always listed."
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # Before anything is installed: a typo such as `mode: retirement` would
    # otherwise run command mode (and its PR comment) without a word.
    - name: Check the mode input
      shell: bash
      env:
        ARBOR_MODE: ${{ inputs.mode }}
      run: |
        case "$ARBOR_MODE" in
          command|retirements) ;;
          *)
            echo "::error title=Arbor::mode must be 'command' or 'retirements', not '${ARBOR_MODE//[$'\r\n%']/}'"
            exit 2
            ;;
        esac

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-registry-

    - name: Install Arbor CLI
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${{ inputs.install-from-source }}" == "true" ]]; then
          cargo install --path crates/arbor-cli --force
        else
          VERSION="${{ inputs.arbor-version }}"
          if [[ "$VERSION" == "latest" ]]; then
            VERSION=$(curl -s https://api.github.com/repos/Anandb71/arbor/releases/latest | grep '"tag_name":' | sed -E 's/.*"v?([^"]+)".*/\1/' || echo "")
          fi
          VERSION="${VERSION#v}"
          
          DOWNLOADED=false
          if [[ -n "$VERSION" ]]; then
            # Release assets are named arbor-<os>-<arch> (arbor-linux-x86_64.tar.gz,
            # arbor-macos-aarch64.tar.gz, arbor-windows-x86_64.zip). This used to
            # build Rust target triples instead, which matched no asset, so every
            # run silently fell back to compiling whatever crates.io had.
            case "$(uname -m 2>/dev/null || echo x86_64)" in
              arm64|aarch64) ARCH="aarch64" ;;
              *) ARCH="x86_64" ;;
            esac
            case "$RUNNER_OS" in
              macOS) OS="macos" ;;
              Windows) OS="windows" ;;
              *) OS="linux" ;;
            esac

            TARBALL="arbor-${OS}-${ARCH}.tar.gz"
            if [[ "$OS" == "windows" ]]; then
              TARBALL="arbor-${OS}-${ARCH}.zip"
            fi

            DOWNLOAD_URL="https://github.com/Anandb71/arbor/releases/download/v${VERSION}/${TARBALL}"
            echo "Attempting to download pre-built binary: $DOWNLOAD_URL"

            if curl -fsSL -o "$TARBALL" "$DOWNLOAD_URL"; then
              echo "Extracting..."
              if [[ "$TARBALL" == *.zip ]]; then
                unzip -q -o "$TARBALL" 2>/dev/null \
                  || powershell -NoProfile -Command "Expand-Archive -Force -Path '$TARBALL' -DestinationPath ." \
                  || true
              else
                tar -xzf "$TARBALL" || true
              fi

              BINARY="arbor"
              if [[ "$OS" == "windows" ]]; then
                BINARY="arbor.exe"
              fi
              
              if [[ -f "$BINARY" ]]; then
                mkdir -p "$HOME/.arbor-bin"
                mv "$BINARY" "$HOME/.arbor-bin/"
                PATH_ENTRY="$HOME/.arbor-bin"
                # GITHUB_PATH is read by the runner, which needs a native
                # path on Windows rather than Git Bash's /c/... form.
                if command -v cygpath >/dev/null 2>&1; then
                  PATH_ENTRY="$(cygpath -w "$PATH_ENTRY")"
                fi
                echo "Adding $PATH_ENTRY to GITHUB_PATH"
                echo "$PATH_ENTRY" >> "$GITHUB_PATH"
                export PATH="$HOME/.arbor-bin:$PATH"
                rm -f "$TARBALL"
                DOWNLOADED=true
                echo "Pre-built binary installed successfully!"
              fi
            fi
          fi
          
          if [[ "$DOWNLOADED" == "false" ]]; then
            echo "Could not download pre-built binary. Building with cargo instead (this might take a few minutes)..."
            # Build the resolved release tag rather than whatever crates.io
            # has: crates.io can lag the GitHub releases.
            if [[ -n "$VERSION" ]]; then
              cargo install --git https://github.com/Anandb71/arbor --tag "v${VERSION}" arbor-graph-cli --locked --force
            else
              cargo install arbor-graph-cli --force
            fi
          fi
        fi

    - name: Check model retirements
      if: inputs.mode == 'retirements'
      shell: bash
      env:
        RET_WORKDIR: ${{ inputs.working-directory }}
        RET_PATH: ${{ inputs.retirements-path }}
        RET_FAIL_ON: ${{ inputs.retirements-fail-on }}
        RET_ROUTED: ${{ inputs.retirements-include-routed }}
        RET_UNCONFIRMED: ${{ inputs.retirements-count-unconfirmed }}
      run: |
        set -uo pipefail
        # Run from the repository root so annotation paths match the repository.
        TARGET="$RET_PATH"
        if [[ -n "$RET_WORKDIR" && "$RET_WORKDIR" != "." ]]; then
          if [[ "$RET_PATH" == "." ]]; then TARGET="$RET_WORKDIR"; else TARGET="${RET_WORKDIR%/}/$RET_PATH"; fi
        fi

        ARGS=()
        if [[ "$RET_ROUTED" == "true" ]]; then ARGS+=(--include-routed); fi
        if [[ "$RET_UNCONFIRMED" == "true" ]]; then ARGS+=(--count-unconfirmed); fi
        case "$RET_FAIL_ON" in
          never|retired) ;;
          ''|*[!0-9]*)
            echo "::error title=Arbor retirements::retirements-fail-on must be 'never', 'retired' or a number of days, not '$RET_FAIL_ON'"
            exit 2
            ;;
          *) ARGS+=(--fail-within "$RET_FAIL_ON") ;;
        esac

        # One scan for both outputs: warning annotations on stdout (GitHub
        # shows at most 10 per step, so Arbor prints 10 and one notice for
        # the rest) and the Markdown report, which lists every call, for the
        # job summary. The exit code says whether anything is failing:
        # 0 nothing, 1 retired (or retiring within the window), 2 error.
        # (`shell: bash` runs with -e, so the exit code is caught, not fatal.)
        REPORT="$(mktemp)"
        CODE=0
        arbor retirements "$TARGET" --annotations --markdown-out "$REPORT" ${ARGS[@]+"${ARGS[@]}"} || CODE=$?
        if [[ -s "$REPORT" ]]; then
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          else
            cat "$REPORT"
          fi
        fi
        rm -f "$REPORT"

        # A check that could not run fails the step even with
        # retirements-fail-on: never: a missing report must not pass quietly.
        if [[ $CODE -ge 2 ]]; then
          echo "::error title=Arbor retirements::the check could not run (exit $CODE); this fails the step whatever retirements-fail-on says"
          exit 2
        fi
        if [[ $CODE -eq 1 && "$RET_FAIL_ON" != "never" ]]; then
          echo "::error title=Arbor retirements::calls use models that are retired or retire within the configured window; see the job summary"
          exit 1
        fi
        exit 0

    - name: Run Arbor and Comment on PR
      if: inputs.mode != 'retirements'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        ARBOR_AUTO_INDEX: "1"
      run: |
        set -euo pipefail
        cd "${{ inputs.working-directory }}"
        
        # 1. Set environment variables for pull requests to specify diff range
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          export ARBOR_DIFF_BASE="$PR_BASE_SHA"
          export ARBOR_DIFF_HEAD="$PR_HEAD_SHA"
          echo "PR environment detected. Range set: $ARBOR_DIFF_BASE ... $ARBOR_DIFF_HEAD"
          
          # Ensure base and head SHAs are fetched and accessible locally for git diff
          if ! git rev-parse --verify "$ARBOR_DIFF_BASE" >/dev/null 2>&1; then
            echo "Fetching base SHA: $ARBOR_DIFF_BASE"
            git fetch --depth=100 origin "$ARBOR_DIFF_BASE" || git fetch origin "$ARBOR_DIFF_BASE" || true
          fi
          if ! git rev-parse --verify "$ARBOR_DIFF_HEAD" >/dev/null 2>&1; then
            echo "Fetching head SHA: $ARBOR_DIFF_HEAD"
            git fetch --depth=100 origin "$ARBOR_DIFF_HEAD" || git fetch origin "$ARBOR_DIFF_HEAD" || true
          fi
        fi

        # 2. Run the normal user-supplied command
        echo "Running: arbor ${{ inputs.command }}"
        arbor ${{ inputs.command }}
        
        # 3. Check if we should post a PR comment
        if [[ "${{ inputs.comment-on-pr }}" == "true" && "${{ github.event_name }}" == "pull_request" ]]; then
          echo "Generating Arbor Impact Report for PR comment..."
          
          # Initialize Arbor if needed to ensure we have a valid index
          arbor init . || true
          arbor index . || true
          
          # Run diff with markdown and capture output
          arbor diff . --markdown > arbor_report.md || true
          
          if [ -f arbor_report.md ] && [ -s arbor_report.md ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            echo "Looking for existing Arbor comments on PR #$PR_NUMBER..."
            
            # Find existing comment from Arbor using GH CLI
            COMMENT_ID=$(gh api repos/${{ github.repository }}/issues/$PR_NUMBER/comments \
              --jq '.[] | select(.body | contains("## 🌳 Arbor Impact Report") or contains("## 🌳 Arbor Safety Check")) | .id' | head -n 1 2>/dev/null || true)
              
            if [ -n "$COMMENT_ID" ]; then
              echo "Updating existing PR comment #$COMMENT_ID..."
              gh api -X PATCH repos/${{ github.repository }}/issues/comments/$COMMENT_ID -F body=@arbor_report.md > /dev/null || echo "Warning: Failed to update existing PR comment."
            else
              echo "Creating a new PR comment..."
              gh pr comment "$PR_NUMBER" --body-file arbor_report.md > /dev/null || echo "Warning: Failed to create new PR comment."
            fi
            
            rm -f arbor_report.md
          else
            echo "No impact report generated or file was empty."
          fi
        fi