[package]
name = "arbor-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
description = "Model Context Protocol server for Arbor"
keywords = ["mcp", "code-analysis", "graph", "ai"]
categories = ["development-tools"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
anyhow = "1.0"
async-trait = "0.1"
# Local Streamable HTTP transport: real HTTP/1.1 framing, deadlines and limits.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"

arbor-core = { path = "../arbor-core", version = "3.0.5" }
arbor-graph = { path = "../arbor-graph", version = "3.0.5" }
arbor-server = { path = "../arbor-server", version = "3.0.5" }
